<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Moedas</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>
    <img src="./assets/logo.gif" alt="logo" class="logo">

    <main>
        <label>
            Converter <b>De</b>
            <select>
                <option>R$ Real Brasiliero</option>
            </select>
        </label>

        <label>
            Converter <b>Para</b>
            <select>
                <option>US$ Dólar Americano</option>
                <option>€ Euro</option>
            </select>
        </label>

        <label>
            Valor
            <input class="input-currency" type="number" placeholder="Digite o valor a ser convertido">
        </label>

        <button class="convert-button">Converter</button>

        <section>
            <div class="currency-box">
                <img src="./assets/brasil 2.png" alt="">
                <p class="currency">Real</p>
                <p class="currency-value-to-convert">R$0,00</p>
            </div>

            <img src="./assets/Vector.png" alt="seta" class="arrow-img">

            <div class="currency-box">
                <img src="./assets/estados-unidos (1) 1.png" alt="">
                <p class="currency">Dólar Americano</p>
                <p class="currency-value">US$0.00</p>
            </div>

        </section>

    </main>
</body>
 
    <script src="./script.js"></script>

</html>
